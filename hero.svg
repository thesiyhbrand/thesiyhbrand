<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">

<rect width="1600" height="520" fill="#050505"/>

<defs>
  <linearGradient id="grid" x1="0" y1="0" x2="1600" y2="520">
    <stop stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- grid -->

<path d="M0 420H1600" stroke="url(#grid)"/>
<path d="M0 350H1600" stroke="url(#grid)"/>
<path d="M0 280H1600" stroke="url(#grid)"/>
<path d="M0 210H1600" stroke="url(#grid)"/>
<path d="M0 140H1600" stroke="url(#grid)"/>

<!-- decorative circle -->

<circle cx="1360" cy="110" r="170" stroke="#fff" stroke-opacity=".08"/>
<circle cx="1360" cy="110" r="120" stroke="#fff" stroke-opacity=".08"/>
<circle cx="1360" cy="110" r="70" stroke="#fff" stroke-opacity=".08"/>

<!-- signature -->

<text
x="120"
y="145"
fill="#777"
font-family="monospace"
font-size="20"
letter-spacing="5">
CREATIVE DEVELOPER / 001 </text>

<!-- main title -->

<text
x="110"
y="245"
fill="#FFFFFF"
font-family="Arial, Helvetica, sans-serif"
font-size="92"
font-weight="700"
letter-spacing="-4">
AMARJEET CHAUDHARY </text>

<!-- underline -->

<path
d="M115 275H910"
stroke="#FFFFFF"
stroke-width="2"/>

<!-- descriptor -->

<text
x="120"
y="335"
fill="#AAAAAA"
font-family="monospace"
font-size="22"
letter-spacing="2">
CODE × DESIGN × MOTION </text>

<text
x="120"
y="390"
fill="#666"
font-family="monospace"
font-size="16">
FRONTEND / UI-UX / GSAP / CREATIVE DEVELOPMENT </text>

<!-- status -->

<circle
cx="120"
cy="455"
r="6"
fill="#FFFFFF"
filter="url(#glow)"/>

<text
x="140"
y="462"
fill="#888"
font-family="monospace"
font-size="15">
ONLINE — BUILDING SOMETHING </text>

<!-- corner mark -->

<text
x="1450"
y="470"
fill="#444"
font-family="monospace"
font-size="14">
/07 </text>

</svg>
